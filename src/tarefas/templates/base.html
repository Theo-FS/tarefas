<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Digite a tarefa e a data de conclusão (opcional):</h1>

    <form method="POST">
        <input type="text" id="tituloTarefa" name="tituloTarefa" placeholder="Nome da tarefa" required>
        <input type="date" id="dataConclusao" name="dataConclusao">
        <button type="submit">Adicionar</button>
    </form>

    <ul id="listaTarefas">
        {% for tarefa in tarefas_da_pagina %}
        <li>
            {{ tarefa.titulo_tarefa }} - {{ tarefa.data_conclusao }}
            
            <!-- Corrigido de tarefa.id para tarefa.id_tarefa -->
            <a href="{{ url_for('apagar_tarefa', id=tarefa.id_tarefa) }}">
                <button type="button" style="background-color: #ff4d4d; color: white; border: none; padding: 2px 6px; cursor: pointer; border-radius: 4px;">
                    APAGAR
                </button>
            </a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
